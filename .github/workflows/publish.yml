name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing + provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: node bin/agent-skillmap.js init --dir tmp-smoke && test -f tmp-smoke/radioactive/SKILL.md && rm -rf tmp-smoke
      - run: npm publish

name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm # add required reviewers to this environment in GitHub settings
    permissions:
      contents: read
      id-token: write # OIDC: npm trusted publishing + provenance, no NPM_TOKEN secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11 # trusted publishing needs npm >= 11.5.1
      - name: Release tag must match package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG"
      - run: npm test
      - run: npm publish --provenance --access public

name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm # add required reviewers to this environment in GitHub settings
    permissions:
      contents: read
      id-token: write # OIDC: npm trusted publishing + provenance, no NPM_TOKEN secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11 # trusted publishing needs npm >= 11.5.1
      - name: Release tag must match package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG"
      - run: npm test
      - run: npm publish --provenance --access public

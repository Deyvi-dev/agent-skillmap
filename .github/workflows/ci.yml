name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
      - name: Installer smoke test
        run: |
          node bin/agent-skillmap.js init --dir tmp-smoke
          test -f tmp-smoke/radioactive/SKILL.md
          test -f tmp-smoke/agent-skillmap/SKILL.md
          rm -rf tmp-smoke
      - name: Package contents
        run: npm pack --dry-run

name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm test
      - name: Installer smoke test
        run: |
          node bin/agent-skillmap.js init --dir tmp-smoke
          test -f tmp-smoke/radioactive/SKILL.md
          test -f tmp-smoke/agent-skillmap/SKILL.md
          rm -rf tmp-smoke
      - name: Package contents
        run: npm pack --dry-run
